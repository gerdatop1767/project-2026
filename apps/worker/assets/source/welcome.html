<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Зубрилка — приветствие</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 72px 80px;
        background:
          radial-gradient(60% 80% at 82% 60%, rgba(139, 20, 245, 0.45), transparent 70%),
          radial-gradient(40% 50% at 10% 0%, rgba(77, 163, 255, 0.22), transparent 70%), var(--bg);
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        width: 84px;
        height: 84px;
      }
      .name {
        font-family: Unbounded, Inter, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -1px;
      }
      .name span {
        background: linear-gradient(90deg, var(--violet), var(--violet-end));
        -webkit-background-clip: text;
        color: transparent;
      }
      h1 {
        margin-top: 64px;
        max-width: 620px;
        font-family: Unbounded, Inter, sans-serif;
        font-weight: 700;
        font-size: 50px;
        line-height: 1.18;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, var(--violet), var(--violet-end));
        -webkit-background-clip: text;
        color: transparent;
      }
      .pills {
        display: flex;
        gap: 14px;
        margin-top: 44px;
      }
      .pill {
        padding: 14px 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(206, 61, 253, 0.45);
        font-weight: 600;
        font-size: 26px;
      }
      .mascot {
        position: absolute;
        right: -10px;
        bottom: -6px;
        width: 640px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand">
        <img src="../../../web/public/branding/v2/logo-icon-desktop.png" alt="" />
        <div class="name">Зубр<span>илка</span></div>
      </div>
      <h1>Готовься к ЕГЭ <em>с удовольствием</em></h1>
      <div class="pills">
        <div class="pill">Бесплатно</div>
        <div class="pill">Разбор ошибок</div>
        <div class="pill">Прогресс</div>
      </div>
      <img class="mascot" src="../../../web/public/branding/v2/landing-mascot.webp" alt="" />
    </div>
  </body>
</html>
