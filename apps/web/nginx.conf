# Static SPA server for the Vite production build. Runs behind Caddy
# (infra/caddy/Caddyfile), which owns TLS/HTTP->HTTPS — this only needs to
# serve files and fall back to the app shell for client-side routes.
#
# SEO (docs/seo/SEO-REPORT.md):
# - indexable pages have their own prerendered HTML (dist/<path>.html, made
#   by seo/prerender.ts) with the right title, canonical and structured data;
# - every other known app route gets the shell dist/app.html (noindex);
# - any other path is a real 404 (the same shell, so a visitor still lands
#   in the app) — no soft 404s, no endless duplicates of the home page;
# - a trailing slash and removed/old addresses redirect permanently.

# Known client-side routes. Must equal APP_ROUTE_PATTERN in
# src/lib/seo.ts (a test compares them).
map $uri $zybrilka_app_shell {
    default /__not_an_app_route__;
    "~^/(training(/(topic|random|variants|mistakes|by-number))?|statistics(/variants/[0-9a-f-]+)?|achievements|subjects(/[a-z-]+)?|profile|theory|materials|learning(/session/[A-Za-z0-9_-]+)?|friends(/[A-Za-z0-9_-]+)?|login|rating|level|favorites|mock-exams|topics|settings|help|faq|privacy|terms|notifications|games(/stress)?|onboarding|landing|telegram-return|admin(/[A-Za-z0-9/_-]*)?)$" /app.html;
}

# HTML must always be revalidated so a new deploy is picked up; other
# files keep nginx's defaults (hashed assets get their own rule below).
map $sent_http_content_type $zybrilka_cache_control {
    ~^text/html "no-cache";
    default "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a relative Location, so they keep Caddy's https host.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header Cache-Control $zybrilka_cache_control;

    # Hashed build assets (dist/assets/*) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brand images (logo, mascots, subject icons) load on almost every page
    # and are versioned by directory (branding/v2/…) — a changed design gets
    # new paths. One day of caching saves a revalidation per image per page
    # view. Task figures (/tasks/) keep the default revalidation so a
    # corrected figure reaches students at once.
    location /branding/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # One address per page: /training/ → /training (query kept).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Removed and renamed pages (the client did the same, now with a real 301).
    location = /about {
        return 301 /;
    }
    location = /training/by-number {
        return 301 /subjects/math?mode=byNumber;
    }
    # Home: the prerendered index.html; its other spellings redirect to "/".
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }
    # The app shell is not a page of its own: only error_page may serve it.
    location = /app.html {
        internal;
    }
    location = /app {
        return 404;
    }

    # Files, then prerendered pages, then the app shell for known routes,
    # else 404 (rendered by the same shell).
    location / {
        try_files $uri $uri.html $zybrilka_app_shell =404;
    }

    error_page 404 /app.html;
}
