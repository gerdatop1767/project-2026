# Static SPA server for the Vite production build. Runs behind Caddy
# (infra/caddy/Caddyfile), which owns TLS/HTTP->HTTPS — this only needs to
# serve files and fall back to index.html for client-side routes.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed build assets (dist/assets/*) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself must always be revalidated so a new deploy is
    # picked up instead of being served from a stale cached shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
