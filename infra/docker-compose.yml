# Production stack: Caddy (public edge, TLS) -> web / api -> postgres,
# plus a one-shot migrate job and a worker. See docs/DEPLOYMENT.md for
# the full setup/backup/restore/deploy runbook.
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Required env (see .env.example): POSTGRES_DB, POSTGRES_USER,
# POSTGRES_PASSWORD, APP_VERSION. Never commit real values — this file
# only references ${VAR} placeholders.
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: zybrilka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume — survives `docker compose down`/`up` and a
      # container rebuild; only `docker compose down -v` or an explicit
      # `docker volume rm` would remove it.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — reachable only from other containers on `internal`,
    # never directly from the host/internet.

  # One-shot: applies pending Drizzle migrations (idempotent — already
  # applied ones are tracked and skipped) and exits. `api` waits for
  # this to finish successfully before it starts, every deploy.
  #
  # Has its own `build:` (identical to `api`'s, cached by Docker after
  # the first build — effectively free) rather than only referencing
  # `image: zybrilka-api:latest`: a plain image reference with no
  # `build:` makes some compose workflows (e.g. an explicit `pull`
  # step some deploy scripts run) try to fetch that name from a
  # registry, where it doesn't exist, and fail with
  # "pull access denied for zybrilka-api".
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: zybrilka-api:latest
    container_name: zybrilka-migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'node_modules/@zybrilka/db/dist/migrate.js']
    restart: 'no'

  # One-shot: upserts the canonical `subjects` rows (packages/db/src/
  # canonicalSubjects.ts) and exits. Runs after `migrate` and before
  # `sync-content`/`api`/`worker`, every deploy. Before this existed,
  # only `migrate` (schema) and `sync-content` (which only ever upserts
  # the single 'math' row as a side effect of importing math tasks) ran
  # automatically — an already-provisioned production database kept
  # whatever subjects it got the first time someone ran the full demo
  # seed by hand (often just 'math'), so Onboarding's "какие предметы
  # сдаёшь?" step let a user pick e.g. "Русский язык" in the UI, then
  # failed to save with a generic error the moment they did (the PUT
  # /me/learning-profile endpoint correctly rejects a subjectId with no
  # matching `subjects` row — see that route's `unknown_subject` check).
  # Safe to run unconditionally on a live database with real users:
  # `syncSubjects` (packages/db/src/syncSubjects.ts) only ever
  # inserts-or-updates a row by its stable `id`, never touching
  # `tasks`/`attempts`/`user_subject_profiles`.
  sync-subjects:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: zybrilka-api:latest
    container_name: zybrilka-sync-subjects
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['node', 'node_modules/@zybrilka/db/dist/syncSubjects.js']
    restart: 'no'

  # One-shot: syncs the EGE-2026 Ященко content (conditionMd,
  # solutionSteps, correctAnswerDisplay, ...) for the full catalog — ten
  # EGE-2026 Ященко math variants (Вариант 1-10, 190 tasks) followed by
  # all eighteen EGE Russian 2027 Дощинский variants (Вариант 1-18, 486
  # tasks) — into their existing task rows and exits. Runs after
  # `migrate` (needs the columns/tables it adds, e.g.
  # correct_answer_display, passages, digit_set_order_insensitive) and
  # before `api`/`worker` start, every deploy — this is what makes a
  # code-only deploy (no one manually re-running an import script)
  # actually bring the live content up to date. Safe to run on a
  # database with real users: every `importVariantN`
  # (packages/db/src/importEge2026VariantN.ts) and every
  # `importRussianVariantN`
  # (packages/db/src/importRussianDoshchinsky2027VariantN.ts) upserts
  # each task by its stable identity (subject + source + variant + task
  # number), never by a freshly-generated id, so re-running this never
  # touches `attempts`/`mistakes`/bookmarks — it only updates content
  # columns on the same rows (EGE Fidelity: Final Polish, production
  # content-migration fix).
  #
  # Runs math V1 -> V2 -> ... -> V10, then the separate math source
  # «ЕГЭ 2027 Ященко» V1 -> V2 -> ... (importEge2027YashchenkoVariantN.ts — its
  # own collection, kept out of «Все источники»), then Russian V1 -> V2
  # -> ... -> V18, strictly in that order (`&&`, not `;` — a failing importer
  # stops the chain immediately rather than letting later ones, or
  # `api`/`worker`, run against a half-synced database) inside one
  # `sh -c`, so the service's own exit code is non-zero the moment ANY
  # importer fails — `api`/`worker`'s `depends_on: sync-content:
  # condition: service_completed_successfully` then correctly blocks
  # startup instead of the deploy silently "succeeding" with only a
  # partial import. History of this gap, fixed in stages: originally
  # sync-content only ran math Variant 1 (Вариант 2-5 existed in the
  # image and passed integration tests against an in-memory test db,
  # but were never synced into any real deployed Postgres); then only
  # EGE Russian 2027 Вариант 1 was added (it had been a deliberate pilot
  # experiment never wired in, so the Russian catalog never appeared on
  # the live site); by the time Russian Вариант 2-18 existed as
  # production-format import scripts with their own passing per-variant
  # test files (see `russianVariantMatrixAudit.test.ts` for the full
  # 18×27 cross-variant audit), they were still not in this chain — the
  # same class of gap, now fixed for all 18.
  #
  # Last in the chain: the «Ударения» mini-game's stress dictionary
  # (packages/db/src/stressDictionary, docs/MINI_GAMES.md). Same rules as
  # the variant importers: upsert by a stable key (word ids — and players'
  # progress on them — survive every run), a word dropped from the data is
  # deactivated, never deleted, and an invalid dictionary makes it exit
  # non-zero before writing anything, which stops `api`/`worker`.
  sync-content:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: zybrilka-api:latest
    container_name: zybrilka-sync-content
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - internal
    depends_on:
      sync-subjects:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >-
        node node_modules/@zybrilka/db/dist/importEge2026Variant1.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant2.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant3.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant4.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant5.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant6.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant7.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant8.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant9.js &&
        node node_modules/@zybrilka/db/dist/importEge2026Variant10.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant1.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant2.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant3.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant4.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant5.js &&
        node node_modules/@zybrilka/db/dist/importEge2027YashchenkoVariant6.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant1.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant2.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant3.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant4.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant5.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant6.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant7.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant8.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant9.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant10.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant11.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant12.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant13.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant14.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant15.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant16.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant17.js &&
        node node_modules/@zybrilka/db/dist/importRussianDoshchinsky2027Variant18.js &&
        node node_modules/@zybrilka/db/dist/stressDictionary/import.js
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: zybrilka-api:latest
    container_name: zybrilka-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      APP_VERSION: ${APP_VERSION:-prod}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Auth: without these, `config.ts` loads fine and VK ID / Yandex ID
      # just report «not configured» instead of a broken redirect — see
      # apps/api/src/modules/auth/{vk,yandex}.ts. (Email sending/SMTP was
      # removed; leftover SMTP_* values in infra/.env are simply ignored.)
      # Previously these were entirely missing from this block, so even
      # a correctly-filled-in infra/.env never actually reached this
      # container — only vars listed here are passed through by Compose.
      WEB_BASE_URL: ${WEB_BASE_URL:-https://zybrilka.ru}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-https://zybrilka.ru/api/v1/auth/vk/callback}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-https://zybrilka.ru/api/v1/auth/yandex/callback}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-3600}
      # Owner-only admin panel (docs/ADMIN.md): comma-separated `users.id`
      # values allowed into /api/v1/admin. Empty (the default) = nobody.
      ADMIN_OWNER_USER_IDS: ${ADMIN_OWNER_USER_IDS:-}
    expose:
      - '3000'
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      sync-content:
        condition: service_completed_successfully
    # No `ports:` — reachable only from Caddy, over `internal`.

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: zybrilka-worker:latest
    container_name: zybrilka-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Telegram bot, admin notifications and broadcasts (docs/TELEGRAM_BOT.md).
      # Same token as the API. Without it the worker sends nothing.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Off by default: reading updates (/start) takes them away from any
      # other service answering this bot. Set to true once nothing else does.
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-false}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://zybrilka.ru}
      ADMIN_OWNER_USER_IDS: ${ADMIN_OWNER_USER_IDS:-}
      # Probed once a minute to notice the site being down (API + database).
      API_HEALTH_URL: http://api:3000/health
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      sync-content:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: zybrilka-web:latest
    container_name: zybrilka-web
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - internal
    # No `ports:` — the web container is reachable only from other
    # containers on the `internal` network (i.e. Caddy), never
    # directly from the host/internet.

  caddy:
    image: caddy:2-alpine
    container_name: zybrilka-caddy
    restart: unless-stopped
    # The Caddyfile lives in its own directory (infra/caddy/) and the
    # whole DIRECTORY is bind-mounted (below), never the single file.
    # A single-file bind mount pins the file's inode at container
    # creation: `git pull` replaces changed files with a new inode, so
    # the running container keeps serving the OLD Caddyfile forever —
    # and `--watch` cannot help, because it only watches the (stale)
    # in-container file. A directory mount follows the live directory
    # entries, so the new file is visible inside the container and
    # `--watch` can reload it. (Never mount `./` itself here — that
    # would expose infra/.env to the proxy container.)
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  internal:
    driver: bridge
